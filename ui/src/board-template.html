function renderExportPopover() {
  popExport.innerHTML = `
    <div class="pop-title"><span>导出画板</span></div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button id="expPng" class="pop-btn primary">导出 PNG 图像</button>
      <button id="expJson" class="pop-btn">导出 .lcanvas 工程文件</button>
      <button id="expCopyJson" class="pop-btn">复制场景 JSON</button>
    </div>
  `;
  document.getElementById('expPng').onclick = async () => {
    const dataUrl = exportBoardPngDataUrl();
    const b64 = dataUrl.split(',')[1];
    await triggerDownload(`${board.id || 'canvas'}.png`, 'image/png', b64, true);
    closeAllPopovers();
  };
  document.getElementById('expJson').onclick = async () => {
    const json = JSON.stringify(board, null, 2);
    await triggerDownload(`${board.id || 'canvas'}.lcanvas`, 'application/json', json, false);
    closeAllPopovers();
  };
  document.getElementById('expCopyJson').onclick = async () => {
    try {
      await navigator.clipboard.writeText(JSON.stringify(board, null, 2));
      showToast('已复制场景 JSON');
    } catch {
      showToast('剪贴板不可用');
    }
    closeAllPopovers();
  };
}

async function triggerDownload(filename, mimeType, data, isBase64) {
  if (isConnected && hostCaps?.downloadFile) {
    try {
      const res = await app.downloadFile({
        contents: [{
          type: 'resource',
          resource: {
            uri: `canvas://export/${filename}`,
            mimeType,
            ...(isBase64 ? { blob: data } : { text: data }),
          },
        }],
      });
      if (!res?.isError) {
        showToast(`已导出 ${filename}`);
        return;
      }
    } catch {}
  }
  const url = isBase64 ? `data:${mimeType};base64,${data}` : `data:${mimeType};charset=utf-8,${encodeURIComponent(data)}`;
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  showToast(`已导出 ${filename}`);
}

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;

  if (e.code === 'Space') {
    spacePressed = true;
    viewportEl.classList.add('is-panning');
    return;
  }

  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) enqueueMutation([{ op: 'redo' }], { includeSnapshot: false });
    else enqueueMutation([{ op: 'undo' }], { includeSnapshot: false });
    return;
  }
  if (mod && e.key.toLowerCase() === 'y') {
    e.preventDefault();
    enqueueMutation([{ op: 'redo' }], { includeSnapshot: false });
    return;
  }
  if (mod && e.key.toLowerCase() === 'd' && selectedIds.size) {
    e.preventDefault();
    duplicateSelection();
    return;
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedIds.size) {
    e.preventDefault();
    deleteSelection();
    return;
  }
  if (e.key === 'Escape') {
    selectedIds.clear();
    closeAllPopovers();
    renderCanvas();
    renderStyleSubPill();
    return;
  }

  const keyMap = { v: 'select', h: 'hand', p: 'pen', m: 'marker', r: 'rect', o: 'ellipse', a: 'arrow', l: 'line', t: 'text', e: 'eraser' };
  const mapped = keyMap[e.key.toLowerCase()];
  if (mapped && !mod) setTool(mapped);
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'Space') {
    spacePressed = false;
    if (!isPanning) viewportEl.classList.remove('is-panning');
  }
});

window.addEventListener('resize', () => {
  if (!userHasPannedOrZoomed) fitViewportToBoard();
  renderCanvas();
});

function escapeHtml(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---------- MCP Apps Bridge Wiring (Handlers registered BEFORE connect!) ----------
async function handleOpenFilePayload(file) {
  if (!file?.resourceUri) return;
  viewMode = 'file';
  fileInfo = file;
  btnAgentShare.style.display = 'none';
  if (canWriteFile) btnSaveFile.style.display = 'inline-flex';
  if (connectPromise) {
    try { await connectPromise; } catch {}
  }
  try {
    const res = await app.readServerResource({ uri: file.resourceUri });
    const content = res?.contents?.[0];
    let text = '';
    if (content?.text) text = content.text;
    else if (content?.blob) {
      const bin = atob(content.blob);
      const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
      text = new TextDecoder().decode(bytes);
    }
    if (text.trim()) {
      const parsed = JSON.parse(text);
      board = { ...board, ...parsed, title: file.name || parsed.title || '画板文件' };
    } else {
      board.title = file.name || '未命名画板';
    }
    hasInitializedView = false;
    fitViewportToBoard();
    renderCanvas();
  } catch (err) {
    showToast('读取文件失败');
  }
}

app.ontoolinput = ({ arguments: args }) => {
  if (args?.file?.resourceUri) {
    handleOpenFilePayload(args.file);
  }
};

app.ontoolresult = (result) => {
  const sc = result?.structuredContent;
  if (!sc) return;
  if (sc.mode === 'file' && sc.file?.resourceUri) {
    handleOpenFilePayload(sc.file);
    return;
  }
  if (sc.deferred) {
    pollSync();
    return;
  }
  if (sc.board) {
    applyBoardData(sc);
  }
};

app.ontoolcancelled = () => {};

app.onhostcontextchanged = (ctx) => {
  applyThemeContext(ctx);
};

async function init() {
  renderStyleSubPill();
  fitViewportToBoard();
  renderCanvas();

  if (window.parent === window) {
    // Direct standalone preview outside Antigravity
    return;
  }

  try {
    connectPromise = app.connect();
    await connectPromise;
    isConnected = true;
    hostCaps = app.getHostCapabilities() || {};
    applyThemeContext(app.getHostContext());

    if (viewMode === 'live' && (hostCaps.message || hostCaps.updateModelContext)) {
      btnAgentShare.style.display = 'inline-flex';
    }
    // Fetch initial board state immediately (especially for manual aux_pane / global launches)
    if (viewMode === 'live' && hostCaps.serverTools) {
      await pollSync();
      startSyncLoop();
    }
  } catch (err) {
    console.warn('MCP App bridge unavailable, running standalone:', err);
  }
}

init();
