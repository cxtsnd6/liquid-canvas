<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Liquid Canvas</title>
  <style>
    :root {
      color-scheme: dark;
      --lc-bg: #070b14;
      --lc-bg-grad-1: rgba(56, 189, 248, 0.16);
      --lc-bg-grad-2: rgba(139, 92, 246, 0.16);
      --lc-bg-grad-3: rgba(20, 184, 166, 0.10);
      --lc-glass-bg: rgba(17, 24, 39, 0.54);
      --lc-glass-bg-hover: rgba(30, 41, 59, 0.68);
      --lc-glass-popover: rgba(15, 23, 42, 0.78);
      --lc-glass-border: rgba(255, 255, 255, 0.16);
      --lc-glass-highlight: rgba(255, 255, 255, 0.24);
      --lc-glass-shadow: 0 14px 40px -10px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.25);
      --lc-text: #f1f5f9;
      --lc-text-muted: rgba(226, 232, 240, 0.62);
      --lc-accent: #38bdf8;
      --lc-accent-soft: rgba(56, 189, 248, 0.22);
      --lc-accent-ring: rgba(56, 189, 248, 0.45);
      --lc-danger: #f87171;
      --lc-board-bg: #0c1222;
      --lc-board-border: rgba(255, 255, 255, 0.12);
      --lc-board-shadow: 0 24px 70px -18px rgba(0, 0, 0, 0.7);
      --lc-grid-dot: rgba(148, 163, 184, 0.18);
      --lc-font: var(--font-sans, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif);
    }

    html[data-theme="light"] {
      color-scheme: light;
      --lc-bg: #eef2f9;
      --lc-bg-grad-1: rgba(56, 189, 248, 0.20);
      --lc-bg-grad-2: rgba(167, 139, 250, 0.18);
      --lc-bg-grad-3: rgba(45, 212, 191, 0.14);
      --lc-glass-bg: rgba(255, 255, 255, 0.62);
      --lc-glass-bg-hover: rgba(255, 255, 255, 0.84);
      --lc-glass-popover: rgba(255, 255, 255, 0.82);
      --lc-glass-border: rgba(255, 255, 255, 0.78);
      --lc-glass-highlight: rgba(255, 255, 255, 0.95);
      --lc-glass-shadow: 0 14px 36px -10px rgba(15, 23, 42, 0.14), 0 2px 10px rgba(15, 23, 42, 0.06);
      --lc-text: #0f172a;
      --lc-text-muted: rgba(15, 23, 42, 0.56);
      --lc-accent: #0284c7;
      --lc-accent-soft: rgba(14, 165, 233, 0.16);
      --lc-accent-ring: rgba(14, 165, 233, 0.36);
      --lc-danger: #ef4444;
      --lc-board-bg: #ffffff;
      --lc-board-border: rgba(15, 23, 42, 0.09);
      --lc-board-shadow: 0 24px 64px -18px rgba(15, 23, 42, 0.16);
      --lc-grid-dot: rgba(100, 116, 139, 0.22);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--lc-font);
      color: var(--lc-text);
      background: var(--lc-bg);
      user-select: none;
    }

    /* Ambient fluid backdrop behind frosted glass */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(60% 55% at 18% 15%, var(--lc-bg-grad-1), transparent 70%),
        radial-gradient(55% 55% at 84% 20%, var(--lc-bg-grad-2), transparent 70%),
        radial-gradient(65% 50% at 50% 92%, var(--lc-bg-grad-3), transparent 72%);
      z-index: 0;
    }

    /* Interactive Stage */
    .viewport {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      touch-action: none;
      cursor: crosshair;
    }

    .viewport[data-tool="select"] { cursor: default; }
    .viewport[data-tool="hand"], .viewport.is-panning { cursor: grab; }
    .viewport.is-panning:active { cursor: grabbing; }
    .viewport[data-tool="text"] { cursor: text; }
    .viewport[data-tool="eraser"] { cursor: cell; }

    .stage-transform {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .artboard-frame {
      position: relative;
      border-radius: 20px;
      border: 1px solid var(--lc-board-border);
      box-shadow: var(--lc-board-shadow);
      overflow: hidden;
      transition: box-shadow 0.25s ease;
    }

    canvas#mainCanvas, canvas#overlayCanvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    canvas#overlayCanvas { pointer-events: none; }

    /* Liquid Glass Surface Primitive */
    .glass {
      background: var(--lc-glass-bg);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid var(--lc-glass-border);
      box-shadow: inset 0 1px 0 var(--lc-glass-highlight), var(--lc-glass-shadow);
    }

    .glass-popover {
      background: var(--lc-glass-popover);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid var(--lc-glass-border);
      box-shadow: inset 0 1px 0 var(--lc-glass-highlight), var(--lc-glass-shadow);
      border-radius: 18px;
    }

    /* Top HUD Bar */
    .hud-top {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: none;
    }

    .pill-group {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      max-width: calc(100vw - 24px);
    }

    .pill-divider {
      width: 1px;
      height: 18px;
      background: var(--lc-glass-border);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .icon-btn, .text-pill-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--lc-text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      height: 30px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
      padding: 0 9px;
      white-space: nowrap;
    }

    .icon-btn {
      width: 30px;
      padding: 0;
    }

    .icon-btn:hover:not(:disabled), .text-pill-btn:hover:not(:disabled) {
      background: var(--lc-glass-bg-hover);
      transform: translateY(-0.5px);
    }

    .icon-btn:active:not(:disabled), .text-pill-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .icon-btn:disabled, .text-pill-btn:disabled {
      opacity: 0.36;
      cursor: default;
    }

    .icon-btn.active, .text-pill-btn.active {
      background: var(--lc-accent-soft);
      color: var(--lc-accent);
      box-shadow: inset 0 0 0 1px var(--lc-accent-ring);
    }

    .accent-pill {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.28), rgba(139, 92, 246, 0.24));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), inset 0 0 0 1px rgba(56, 189, 248, 0.38);
    }
    .accent-pill:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.40), rgba(139, 92, 246, 0.34));
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.75);
      flex-shrink: 0;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }
    .status-dot.syncing {
      background: var(--lc-accent);
      box-shadow: 0 0 12px var(--lc-accent);
      animation: pulse 1s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }

    /* Bottom Dock & Contextual Style Sub-Pill */
    .hud-bottom {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      max-width: calc(100vw - 16px);
    }

    .sub-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      max-width: calc(100vw - 20px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sub-pill::-webkit-scrollbar { display: none; }
    .sub-pill.hidden { display: none; }

    .dock {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 5px;
      border-radius: 999px;
      max-width: calc(100vw - 16px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .dock::-webkit-scrollbar { display: none; }

    .tool-btn {
      position: relative;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--lc-text);
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.18s ease, color 0.18s ease;
    }
    .tool-btn:hover {
      background: var(--lc-glass-bg-hover);
      transform: translateY(-1px);
    }
    .tool-btn.active {
      background: linear-gradient(145deg, var(--lc-accent-soft), rgba(139, 92, 246, 0.18));
      color: var(--lc-accent);
      box-shadow: inset 0 1px 0 var(--lc-glass-highlight), inset 0 0 0 1px var(--lc-accent-ring);
      transform: translateY(-1px);
    }

    /* Swatches & Size Dots */
    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }
    .swatch:hover { transform: scale(1.14); }
    .swatch.active {
      transform: scale(1.15);
      box-shadow: 0 0 0 2px var(--lc-glass-bg), 0 0 0 3.5px var(--lc-accent);
    }
    .color-picker-wrap {
      position: relative;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: conic-gradient(#f43f5e, #f59e0b, #10b981, #38bdf8, #8b5cf6, #f43f5e);
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      flex-shrink: 0;
      overflow: hidden;
    }
    .color-picker-wrap input[type="color"] {
      position: absolute;
      inset: -6px;
      width: 32px;
      height: 32px;
      opacity: 0;
      cursor: pointer;
    }

    .size-btn {
      appearance: none;
      border: none;
      background: transparent;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--lc-text);
      flex-shrink: 0;
    }
    .size-btn:hover { background: var(--lc-glass-bg-hover); }
    .size-btn.active {
      background: var(--lc-accent-soft);
      box-shadow: inset 0 0 0 1px var(--lc-accent-ring);
    }
    .size-dot {
      border-radius: 50%;
      background: currentColor;
    }

    .chip-toggle {
      appearance: none;
      border: 1px solid var(--lc-glass-border);
      background: transparent;
      color: var(--lc-text-muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .chip-toggle.active {
      color: var(--lc-accent);
      background: var(--lc-accent-soft);
      border-color: var(--lc-accent-ring);
    }

    /* Popovers */
    .popover {
      position: fixed;
      z-index: 30;
      padding: 12px;
      min-width: 220px;
      max-width: min(320px, calc(100vw - 24px));
      color: var(--lc-text);
      font-size: 12px;
      animation: popIn 0.16s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .popover.hidden { display: none; }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .pop-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--lc-text-muted);
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pop-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 220px;
      overflow-y: auto;
    }

    .pop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.14s ease;
    }
    .pop-row:hover { background: var(--lc-glass-bg-hover); }
    .pop-row.active {
      background: var(--lc-accent-soft);
      box-shadow: inset 0 0 0 1px var(--lc-accent-ring);
    }

    .pop-input, .pop-textarea {
      width: 100%;
      border: 1px solid var(--lc-glass-border);
      background: rgba(127, 127, 127, 0.08);
      color: var(--lc-text);
      border-radius: 10px;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    .pop-input:focus, .pop-textarea:focus {
      border-color: var(--lc-accent);
      box-shadow: 0 0 0 2px var(--lc-accent-soft);
    }

    .pop-btn {
      appearance: none;
      border: 1px solid var(--lc-glass-border);
      background: var(--lc-glass-bg);
      color: var(--lc-text);
      border-radius: 10px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background-color 0.14s ease;
    }
    .pop-btn:hover { background: var(--lc-glass-bg-hover); }
    .pop-btn.primary {
      background: var(--lc-accent-soft);
      border-color: var(--lc-accent-ring);
      color: var(--lc-accent);
    }
    .pop-btn.danger {
      color: var(--lc-danger);
    }

    /* Floating inline text editor on canvas */
    .floating-text-box {
      position: fixed;
      z-index: 25;
      min-width: 120px;
      max-width: 360px;
      padding: 8px 12px;
      border-radius: 14px;
      background: var(--lc-glass-popover);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--lc-accent-ring);
      box-shadow: var(--lc-glass-shadow);
    }
    .floating-text-box.hidden { display: none; }
    .floating-text-box textarea {
      width: 100%;
      min-height: 36px;
      resize: both;
      border: none;
      background: transparent;
      color: var(--lc-text);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.4;
      outline: none;
    }
    .floating-text-hint {
      font-size: 10px;
      color: var(--lc-text-muted);
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }

    /* Subtle toast notification */
    .toast {
      position: fixed;
      top: 54px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 40;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 520px) {
      .hud-top { top: 8px; left: 8px; right: 8px; }
      .hud-bottom { bottom: 10px; }
      .tool-btn { width: 30px; height: 30px; }
      .hide-xs { display: none; }
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <!-- Interactive Canvas Viewport -->
  <div id="viewport" class="viewport" data-tool="pen">
    <div id="stageTransform" class="stage-transform">
      <div id="artboardFrame" class="artboard-frame">
        <canvas id="mainCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Top Floating HUD -->
  <div class="hud-top">
    <div class="pill-group glass">
      <button id="btnBoardMenu" class="text-pill-btn" title="切换或新建画板">
        <span id="statusDot" class="status-dot"></span>
        <span id="boardTitleLabel">主画板</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <span class="pill-divider"></span>
      <button id="btnUndo" class="icon-btn" title="撤销 (Ctrl+Z)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
      </button>
      <button id="btnRedo" class="icon-btn" title="重做 (Ctrl+Shift+Z)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/></svg>
      </button>
      <span class="pill-divider"></span>
      <button id="btnZoomFit" class="text-pill-btn" title="重置/适配视图 (双击或点击适配)">
        <span id="zoomLabel">100%</span>
      </button>
    </div>

    <div class="pill-group glass">
      <button id="btnLayers" class="icon-btn" title="图层管理">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
      </button>
      <button id="btnCanvasCfg" class="icon-btn" title="画布设置">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </button>
      <button id="btnExport" class="icon-btn" title="导出图像">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
      </button>
      <button id="btnClear" class="icon-btn" title="清空画板">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      </button>
      <button id="btnSaveFile" class="text-pill-btn accent-pill" style="display:none" title="保存 .lcanvas 文件">
        <span>保存</span>
      </button>
      <button id="btnAgentShare" class="text-pill-btn accent-pill" style="display:none" title="发送画布给智能体或附加到对话">

  <script type="module">
/* __EXT_APPS_SDK__ */

const FONT_STACK = 'system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';

};
const COLORS = [

];
const STROKE_WIDTHS = [2, 4, 8, 16];

const app = new App({ name: 'LiquidCanvas', version: '1.0.0' }, {});
let hostCaps = {};
let hostTheme = 'dark';
let isConnected = false;
let viewMode = 'live'; // 'live' | 'file'
let fileInfo = null;
let canWriteFile = false;

let board = {
  id: 'main',
  title: '主画板',
  width: 1200,
  height: 800,
  background: 'auto',
  showGrid: true,
  revision: 0,
  updatedBy: 'system',
  activeLayerId: 'layer-1',

};
let boardsList = [];

let canRedoServer = false;

// Viewport & interaction state

let activeStrokeWidth = 4;

let spacePressed = false;

let draftElement = null;
let eraserHitIds = new Set();

let editingTextId = null;

let mutationChain = Promise.resolve();
let mutatingCount = 0;
let syncTimer = null;
let syncInFlight = false;
let hasInitializedView = false;
let userHasPannedOrZoomed = false;

// DOM refs
const viewportEl = document.getElementById('viewport');

const artboardEl = document.getElementById('artboardFrame');
const mainCanvas = document.getElementById('mainCanvas');
const overlayCanvas = document.getElementById('overlayCanvas');

const overlayCtx = overlayCanvas.getContext('2d');
const statusDot = document.getElementById('statusDot');
const boardTitleLabel = document.getElementById('boardTitleLabel');
const zoomLabel = document.getElementById('zoomLabel');
const btnUndo = document.getElementById('btnUndo');
const btnRedo = document.getElementById('btnRedo');
const styleSubPill = document.getElementById('styleSubPill');
const textEditorEl = document.getElementById('textEditor');
const textInputEl = document.getElementById('textInput');

let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');

  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function setSyncing(flag) {

}

function resolveCanvasBg(bg, theme) {
  if (!bg || bg === 'auto') return theme === 'light' ? '#ffffff' : '#0c1222';
  if (bg === 'dark') return '#0c1222';
  if (bg === 'light') return '#ffffff';
  if (bg === 'transparent') return 'transparent';
  return bg;
}

function colorWithAlpha(hexOrColor, alpha) {
  if (!hexOrColor || hexOrColor === 'none' || hexOrColor === 'transparent') return 'transparent';
  if (hexOrColor.startsWith('#')) {
    const h = hexOrColor.slice(1);
    const full = h.length === 3 ? h.split('').map((c) => c + c).join('') : h.slice(0, 6);
    const r = parseInt(full.slice(0, 2), 16);
    const g = parseInt(full.slice(2, 4), 16);
    const b = parseInt(full.slice(4, 6), 16);
    if (Number.isFinite(r)) return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }
  return hexOrColor;
}

function applyThemeContext(ctx) {
  if (ctx?.theme) {
    hostTheme = ctx.theme === 'light' ? 'light' : 'dark';
    applyDocumentTheme(hostTheme);
    document.documentElement.setAttribute('data-theme', hostTheme);
    if (activeColor === '#f8fafc' && hostTheme === 'light') activeColor = '#0f172a';
    else if (activeColor === '#0f172a' && hostTheme === 'dark') activeColor = '#f8fafc';
  }
  if (ctx?.styles?.variables) {
    applyHostStyleVariables(ctx.styles.variables);
  }
  if (ctx?.['com.google.antigravity/resources']?.write) {
    canWriteFile = true;
    if (viewMode === 'file') btnSaveFile.style.display = 'inline-flex';
  }
  renderCanvas();
  renderStyleSubPill();
}

function fitViewportToBoard() {
  const vw = window.innerWidth || 800;
  const vh = window.innerHeight || 600;
  if (vw < 40 || vh < 40) return;
  const padX = vw < 520 ? 32 : 80;
  const padY = vw < 520 ? 140 : 160;
  const s = Math.min((vw - padX) / board.width, (vh - padY) / board.height, 1.2);
  view.scale = Math.max(0.2, Math.min(2.5, Number(s.toFixed(3))));
  view.x = Math.round((vw - board.width * view.scale) / 2);
  view.y = Math.round((vh - board.height * view.scale) / 2) - 6;
  applyViewportTransform();
}

function applyViewportTransform() {
  stageEl.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
  zoomLabel.textContent = `${Math.round(view.scale * 100)}%`;
}

function screenToBoard(clientX, clientY) {
  return {
    x: (clientX - view.x) / view.scale,
    y: (clientY - view.y) / view.scale,
  };
}

function boardToScreen(bx, by) {
  return {
    x: bx * view.scale + view.x,
    y: by * view.scale + view.y,
  };
}

// ---------- Geometry & Bounds ----------
function getBounds(el) {
  if (!el) return { x: 0, y: 0, w: 0, h: 0 };
  switch (el.type) {
    case 'rect':
    case 'image':
      return { x: el.x, y: el.y, w: el.w, h: el.h };
    case 'ellipse':
      return { x: el.cx - el.rx, y: el.cy - el.ry, w: el.rx * 2, h: el.ry * 2 };
    case 'line':
    case 'arrow': {
      const xs = [el.x1, el.x2];
      const ys = [el.y1, el.y2];
      if (el.cx !== undefined && el.cy !== undefined) { xs.push(el.cx); ys.push(el.cy); }
      const minX = Math.min(...xs), minY = Math.min(...ys);
      const maxX = Math.max(...xs), maxY = Math.max(...ys);
      return { x: minX, y: minY, w: Math.max(8, maxX - minX), h: Math.max(8, maxY - minY) };
    }
    case 'freehand':
    case 'polygon': {
      const pts = el.points || [];
      if (!pts.length) return { x: 0, y: 0, w: 10, h: 10 };
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of pts) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      const pad = Math.max(4, (el.strokeWidth || 2) / 2);
      return { x: minX - pad, y: minY - pad, w: Math.max(10, maxX - minX + pad * 2), h: Math.max(10, maxY - minY + pad * 2) };
    }
    case 'path': {
      const nums = String(el.d || '').match(/-?\d*\.?\d+/g) || [];
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i + 1 < nums.length; i += 2) {
        const px = Number(nums[i]), py = Number(nums[i + 1]);
        if (Number.isFinite(px) && Number.isFinite(py)) {
          if (px < minX) minX = px; if (py < minY) minY = py;
          if (px > maxX) maxX = px; if (py > maxY) maxY = py;
        }
      }
      if (!Number.isFinite(minX)) return { x: el.x || 0, y: el.y || 0, w: 40, h: 40 };
      const sx = el.scaleX ?? 1, sy = el.scaleY ?? 1;
      return { x: (el.x || 0) + minX * sx, y: (el.y || 0) + minY * sy, w: Math.max(10, (maxX - minX) * sx), h: Math.max(10, (maxY - minY) * sy) };
    }
    case 'text': {
      const lines = String(el.text || '').split(/\r?\n/);
      const fs = el.fontSize || 20;
      mainCtx.save();
      mainCtx.font = `${el.fontWeight || '500'} ${fs}px ${el.fontFamily || 'sans-serif'}`;
      let maxW = 24;
      for (const line of lines) {
        maxW = Math.max(maxW, mainCtx.measureText(line || ' ').width);
      }
      mainCtx.restore();
      const pad = el.padding ?? (el.background ? 10 : 4);
      const h = Math.max(fs * 1.35, lines.length * fs * 1.35);
      let x = el.x;
      if (el.align === 'center') x -= maxW / 2;
      else if (el.align === 'right') x -= maxW;
      return { x: x - pad, y: el.y - pad, w: maxW + pad * 2, h: h + pad * 2 };
    }
    default:
      return { x: 0, y: 0, w: 40, h: 40 };
  }
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1);
  const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function hitTestElement(el, bx, by, tol = 8) {
  if (!el || el.visible === false || el.locked) return false;
  if (el.type === 'freehand' || el.type === 'polygon') {
    const pts = el.points || [];
    const hitTol = Math.max(tol, (el.strokeWidth || 4) / 2 + 6);
    if (pts.length === 1) return Math.hypot(bx - pts[0].x, by - pts[0].y) <= hitTol;
    for (let i = 1; i < pts.length; i++) {
      if (distToSegment(bx, by, pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y) <= hitTol) return true;
    }
    if (el.type === 'polygon' && el.fill && el.fill !== 'none') {
      const b = getBounds(el);
      return bx >= b.x && bx <= b.x + b.w && by >= b.y && by <= b.y + b.h;
    }
    return false;
  }
  if (el.type === 'line' || el.type === 'arrow') {
    const hitTol = Math.max(tol, (el.strokeWidth || 2) / 2 + 7);
    if (el.cx !== undefined && el.cy !== undefined) {
      let prevX = el.x1, prevY = el.y1;
      for (let i = 1; i <= 16; i++) {
        const t = i / 16;
        const qx = (1 - t) ** 2 * el.x1 + 2 * (1 - t) * t * el.cx + t ** 2 * el.x2;
        const qy = (1 - t) ** 2 * el.y1 + 2 * (1 - t) * t * el.cy + t ** 2 * el.y2;
        if (distToSegment(bx, by, prevX, prevY, qx, qy) <= hitTol) return true;
        prevX = qx; prevY = qy;
      }
      return false;
    }
    return distToSegment(bx, by, el.x1, el.y1, el.x2, el.y2) <= hitTol;
  }
  if (el.type === 'ellipse') {
    const nx = (bx - el.cx) / (el.rx + tol);
    const ny = (by - el.cy) / (el.ry + tol);
    return nx * nx + ny * ny <= 1;
  }
  const b = getBounds(el);
  return bx >= b.x - tol && bx <= b.x + b.w + tol && by >= b.y - tol && by <= b.y + b.h + tol;
}

function findHitElement(bx, by) {
  const layersById = new Map((board.layers || []).map((l) => [l.id, l]));
  for (let i = board.elements.length - 1; i >= 0; i--) {
    const el = board.elements[i];
    const layer = layersById.get(el.layerId);
    if (layer && (layer.visible === false || layer.locked)) continue;
    if (hitTestElement(el, bx, by, 8 / view.scale)) return el;
  }
  return null;
}

// ---------- Canvas Rendering Engine ----------
const imageCache = new Map();
function getLoadedImage(src) {
  if (!src) return null;
  let entry = imageCache.get(src);
  if (!entry) {
    const img = new Image();
    entry = { img, loaded: false };
    img.onload = () => {
      entry.loaded = true;
      renderCanvas();
    };
    img.src = src;
    imageCache.set(src, entry);
  }
  return entry.loaded ? entry.img : null;
}

function drawRoundedRectPath(ctx, x, y, w, h, r) {
  const rad = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(x, y, w, h, rad);
  } else {
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }
}

function drawElementOnCtx(ctx, el, { faded = false } = {}) {
  ctx.save();
  const op = (el.opacity ?? 1) * (faded ? 0.25 : 1);
  ctx.globalAlpha *= op;

  if (el.rotation) {
    const b = getBounds(el);
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    ctx.translate(cx, cy);
    ctx.rotate((el.rotation * Math.PI) / 180);
    ctx.translate(-cx, -cy);
  }

  if (Array.isArray(el.dash) && el.dash.length) ctx.setLineDash(el.dash);

  const setupFill = (bounds) => {
    if (el.fillGradient && Array.isArray(el.fillGradient.stops) && el.fillGradient.stops.length >= 2) {
      const ang = ((el.fillGradient.angle ?? 135) * Math.PI) / 180;
      const cx = bounds.x + bounds.w / 2;
      const cy = bounds.y + bounds.h / 2;
      const dx = Math.cos(ang) * (bounds.w / 2);
      const dy = Math.sin(ang) * (bounds.h / 2);
      const grad = ctx.createLinearGradient(cx - dx, cy - dy, cx + dx, cy + dy);
      for (const s of el.fillGradient.stops) grad.addColorStop(s.offset ?? 0, s.color);
      return grad;
    }
    return el.fill && el.fill !== 'none' ? el.fill : null;
  };

  if (el.type === 'rect') {
    if (el.shadow || el.glass) {
      ctx.shadowColor = hostTheme === 'light' ? 'rgba(15, 23, 42, 0.14)' : 'rgba(0, 0, 0, 0.45)';
      ctx.shadowBlur = el.glass ? 22 : 14;
      ctx.shadowOffsetY = 6;
    }
    drawRoundedRectPath(ctx, el.x, el.y, el.w, el.h, el.radius ?? 14);
    if (el.glass) {
      const g = ctx.createLinearGradient(el.x, el.y, el.x, el.y + el.h);
      if (hostTheme === 'light') {
        g.addColorStop(0, 'rgba(255,255,255,0.78)');
        g.addColorStop(1, 'rgba(241,245,249,0.48)');
      } else {
        g.addColorStop(0, 'rgba(255,255,255,0.16)');
        g.addColorStop(1, 'rgba(255,255,255,0.04)');
      }
      ctx.fillStyle = g;
      ctx.fill();
      ctx.shadowColor = 'transparent';
      // Specular inner top rim
      ctx.save();
      ctx.clip();
      ctx.strokeStyle = hostTheme === 'light' ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.34)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(el.x + (el.radius || 0), el.y + 1);
      ctx.lineTo(el.x + el.w - (el.radius || 0), el.y + 1);
      ctx.stroke();
      ctx.restore();
    } else {
      const fillVal = setupFill(el);
      if (fillVal) { ctx.fillStyle = fillVal; ctx.fill(); }
    }
    ctx.shadowColor = 'transparent';
    if (el.stroke && el.stroke !== 'none' && (el.strokeWidth ?? 2) > 0) {
      ctx.strokeStyle = el.stroke;
      ctx.lineWidth = el.strokeWidth ?? 2;
      ctx.stroke();
    }
  } else if (el.type === 'ellipse') {
    if (el.shadow) {
      ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
      ctx.shadowBlur = 14;
      ctx.shadowOffsetY = 5;
    }
    ctx.beginPath();
    ctx.ellipse(el.cx, el.cy, el.rx, el.ry, 0, 0, Math.PI * 2);
    const fillVal = setupFill({ x: el.cx - el.rx, y: el.cy - el.ry, w: el.rx * 2, h: el.ry * 2 });
    if (fillVal) { ctx.fillStyle = fillVal; ctx.fill(); }
    ctx.shadowColor = 'transparent';
    if (el.stroke && el.stroke !== 'none' && (el.strokeWidth ?? 2) > 0) {
      ctx.strokeStyle = el.stroke;
      ctx.lineWidth = el.strokeWidth ?? 2;
      ctx.stroke();
    }
  } else if (el.type === 'freehand') {
    const pts = el.points || [];
    if (pts.length) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = el.stroke || '#38bdf8';
      ctx.lineWidth = el.strokeWidth || 4;
      if (el.brush === 'glow') {
        ctx.shadowColor = el.stroke || '#38bdf8';
        ctx.shadowBlur = Math.max(10, (el.strokeWidth || 4) * 2.6);
      }
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      if (pts.length === 1) {
        ctx.lineTo(pts[0].x + 0.1, pts[0].y + 0.1);
      } else if (el.smooth !== false && pts.length > 2) {
        for (let i = 1; i < pts.length - 1; i++) {
          const mx = (pts[i].x + pts[i + 1].x) / 2;
          const my = (pts[i].y + pts[i + 1].y) / 2;
          ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
        }
        const last = pts[pts.length - 1];
        ctx.lineTo(last.x, last.y);
      } else {
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.stroke();
    }
  } else if (el.type === 'polygon') {
    const pts = el.points || [];
    if (pts.length) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      if (el.smooth && pts.length > 2) {
        for (let i = 1; i < pts.length - 1; i++) {
          const mx = (pts[i].x + pts[i + 1].x) / 2;
          const my = (pts[i].y + pts[i + 1].y) / 2;
          ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
        }
        ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
      } else {
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      }
      if (el.closed !== false) ctx.closePath();
      const fillVal = setupFill(getBounds(el));
      if (fillVal) { ctx.fillStyle = fillVal; ctx.fill(); }
      if (el.stroke && el.stroke !== 'none' && (el.strokeWidth ?? 2) > 0) {
        ctx.strokeStyle = el.stroke;
        ctx.lineWidth = el.strokeWidth ?? 2;
        ctx.stroke();
      }
    }
  } else if (el.type === 'path') {
    ctx.save();
    ctx.translate(el.x || 0, el.y || 0);
    ctx.scale(el.scaleX ?? 1, el.scaleY ?? 1);
    const p2d = new Path2D(el.d || '');
    if (el.shadow) {
      ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
      ctx.shadowBlur = 12;
    }
    if (el.fill && el.fill !== 'none') {
      ctx.fillStyle = el.fill;
      ctx.fill(p2d);
    }
    ctx.shadowColor = 'transparent';
    if (el.stroke && el.stroke !== 'none' && (el.strokeWidth ?? 2) > 0) {
      ctx.strokeStyle = el.stroke;
      ctx.lineWidth = el.strokeWidth ?? 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke(p2d);
    }
    ctx.restore();
  } else if (el.type === 'line' || el.type === 'arrow') {
    const sw = el.strokeWidth || 2.5;
    ctx.strokeStyle = el.stroke || '#38bdf8';
    ctx.fillStyle = el.stroke || '#38bdf8';
    ctx.lineWidth = sw;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(el.x1, el.y1);
    if (el.cx !== undefined && el.cy !== undefined) {
      ctx.quadraticCurveTo(el.cx, el.cy, el.x2, el.y2);
    } else {
      ctx.lineTo(el.x2, el.y2);
    }
    ctx.stroke();

    const drawHead = (fx, fy, tx, ty, kind) => {
      if (kind === 'dot') {
        ctx.beginPath();
        ctx.arc(tx, ty, Math.max(3, sw * 1.4), 0, Math.PI * 2);
        ctx.fill();
      } else if (kind === 'arrow') {
        const ang = Math.atan2(ty - fy, tx - fx);
        const head = Math.max(10, sw * 3.6);
        ctx.beginPath();
        ctx.moveTo(tx - head * Math.cos(ang - 0.45), ty - head * Math.sin(ang - 0.45));
        ctx.lineTo(tx, ty);
        ctx.lineTo(tx - head * Math.cos(ang + 0.45), ty - head * Math.sin(ang + 0.45));
        ctx.stroke();
      }
    };

    const ax = el.cx !== undefined ? el.cx : el.x1;
    const ay = el.cy !== undefined ? el.cy : el.y1;
    if (el.endArrow && el.endArrow !== 'none') drawHead(ax, ay, el.x2, el.y2, el.endArrow);
    if (el.startArrow && el.startArrow !== 'none') drawHead(ax, ay, el.x1, el.y1, el.startArrow);

    if (el.label) {
      const mx = el.cx !== undefined ? (el.x1 + 2 * el.cx + el.x2) / 4 : (el.x1 + el.x2) / 2;
      const my = el.cy !== undefined ? (el.y1 + 2 * el.cy + el.y2) / 4 : (el.y1 + el.y2) / 2;
      ctx.font = `500 12px ${FONT_STACK}`;
      const tw = ctx.measureText(el.label).width;
      drawRoundedRectPath(ctx, mx - tw / 2 - 8, my - 12, tw + 16, 24, 999);
      ctx.fillStyle = el.labelBg || (hostTheme === 'light' ? 'rgba(255,255,255,0.88)' : 'rgba(15,23,42,0.85)');
      ctx.fill();
      ctx.strokeStyle = el.stroke || '#38bdf8';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = hostTheme === 'light' ? '#0f172a' : '#f1f5f9';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(el.label, mx, my);
    }
  } else if (el.type === 'text') {
    const fs = el.fontSize || 20;
    const lines = String(el.text || '').split(/\r?\n/);
    ctx.font = `${el.fontWeight || '500'} ${fs}px ${el.fontFamily || 'system-ui, sans-serif'}`;
    ctx.textAlign = el.align || 'left';
    ctx.textBaseline = 'top';
    if (el.background) {
      const b = getBounds(el);
      drawRoundedRectPath(ctx, b.x, b.y, b.w, b.h, el.radius ?? 10);
      ctx.fillStyle = el.background;
      ctx.fill();
    }
    ctx.fillStyle = el.color || (hostTheme === 'light' ? '#0f172a' : '#f1f5f9');
    lines.forEach((line, idx) => {
      ctx.fillText(line, el.x, el.y + idx * fs * 1.35);
    });
  } else if (el.type === 'image' && el.src) {
    const img = getLoadedImage(el.src);
    if (img) {
      ctx.save();
      drawRoundedRectPath(ctx, el.x, el.y, el.w, el.h, el.radius ?? 12);
      ctx.clip();
      ctx.drawImage(img, el.x, el.y, el.w, el.h);
      ctx.restore();
    } else {
      drawRoundedRectPath(ctx, el.x, el.y, el.w, el.h, el.radius ?? 12);
      ctx.fillStyle = 'rgba(148, 163, 184, 0.14)';
      ctx.fill();
    }
  }

  ctx.restore();
}

function renderBoardToCanvas(targetCanvas, targetCtx, { forExport = false } = {}) {
  const dpr = forExport ? 1 : Math.min(2, window.devicePixelRatio || 1);
  const w = board.width || 1200;
  const h = board.height || 800;
  const scale = forExport && w > 1000 ? 1000 / w : 1;
  const cw = Math.round(w * scale);
  const ch = Math.round(h * scale);

  if (targetCanvas.width !== cw * dpr || targetCanvas.height !== ch * dpr) {
    targetCanvas.width = cw * dpr;
    targetCanvas.height = ch * dpr;
  }
  if (!forExport) {
    artboardEl.style.width = `${w}px`;
    artboardEl.style.height = `${h}px`;
    overlayCanvas.width = w * dpr;
    overlayCanvas.height = h * dpr;
  }

  targetCtx.save();
  targetCtx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  targetCtx.clearRect(0, 0, w, h);

  const bg = resolveCanvasBg(board.background, hostTheme);
  if (bg !== 'transparent') {
    targetCtx.fillStyle = bg;
    targetCtx.fillRect(0, 0, w, h);
  } else if (!forExport) {
    // Subtle checkerboard hint for transparent mode
    targetCtx.fillStyle = hostTheme === 'light' ? 'rgba(15,23,42,0.03)' : 'rgba(255,255,255,0.02)';
    const sz = 24;
    for (let y = 0; y < h; y += sz) {
      for (let x = ((y / sz) % 2) * sz; x < w; x += sz * 2) {
        targetCtx.fillRect(x, y, sz, sz);
      }
    }
  }

  if (board.showGrid !== false) {
    targetCtx.fillStyle = hostTheme === 'light' ? 'rgba(100,116,139,0.22)' : 'rgba(148,163,184,0.18)';
    const step = 32;
    for (let y = step; y < h; y += step) {
      for (let x = step; x < w; x += step) {
        targetCtx.fillRect(x - 0.8, y - 0.8, 1.6, 1.6);
      }
    }
  }

  const layersById = new Map((board.layers || []).map((l) => [l.id, l]));
  for (const el of board.elements || []) {
    if (el.visible === false) continue;
    if (!forExport && el.id === editingTextId) continue;
    const layer = layersById.get(el.layerId);
    if (layer && layer.visible === false) continue;
    targetCtx.save();
    if (layer && layer.opacity !== undefined) targetCtx.globalAlpha *= layer.opacity;
    drawElementOnCtx(targetCtx, el, { faded: !forExport && eraserHitIds.has(el.id) });
    targetCtx.restore();
  }

  if (!forExport && draftElement) {
    drawElementOnCtx(targetCtx, draftElement);
  }

  targetCtx.restore();
}

function getCombinedSelectionBounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  let count = 0;
  for (const el of board.elements) {
    if (!selectedIds.has(el.id)) continue;
    const b = getBounds(el);
    minX = Math.min(minX, b.x);
    minY = Math.min(minY, b.y);
    maxX = Math.max(maxX, b.x + b.w);
    maxY = Math.max(maxY, b.y + b.h);
    count++;
  }
  if (!count) return null;
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY, count };
}

function getResizeHandles(b) {
  const mx = b.x + b.w / 2, my = b.y + b.h / 2;
  return [
    { id: 'nw', x: b.x, y: b.y },
    { id: 'n', x: mx, y: b.y },
    { id: 'ne', x: b.x + b.w, y: b.y },
    { id: 'e', x: b.x + b.w, y: my },
    { id: 'se', x: b.x + b.w, y: b.y + b.h },
    { id: 's', x: mx, y: b.y + b.h },
    { id: 'sw', x: b.x, y: b.y + b.h },
    { id: 'w', x: b.x, y: my },
  ];
}

function renderOverlay() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  overlayCtx.save();
  overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  overlayCtx.clearRect(0, 0, board.width, board.height);

  // Marquee box
  if (dragState?.mode === 'marquee') {
    const x = Math.min(dragState.x0, dragState.x1);
    const y = Math.min(dragState.y0, dragState.y1);
    const w = Math.abs(dragState.x1 - dragState.x0);
    const h = Math.abs(dragState.y1 - dragState.y0);
    overlayCtx.fillStyle = 'rgba(56, 189, 248, 0.12)';
    overlayCtx.strokeStyle = '#38bdf8';
    overlayCtx.lineWidth = 1.5 / view.scale;
    overlayCtx.fillRect(x, y, w, h);
    overlayCtx.strokeRect(x, y, w, h);
  }

  // Selection outlines & handles
  const selBounds = getCombinedSelectionBounds();
  if (selBounds && activeTool === 'select') {
    const pad = 4 / view.scale;
    const bx = selBounds.x - pad;
    const by = selBounds.y - pad;
    const bw = selBounds.w + pad * 2;
    const bh = selBounds.h + pad * 2;
    overlayCtx.strokeStyle = '#38bdf8';
    overlayCtx.lineWidth = 1.5 / view.scale;
    overlayCtx.setLineDash([5 / view.scale, 4 / view.scale]);
    overlayCtx.strokeRect(bx, by, bw, bh);
    overlayCtx.setLineDash([]);

    if (selBounds.count === 1) {
      const hs = 8 / view.scale;
      for (const h of getResizeHandles({ x: bx, y: by, w: bw, h: bh })) {
        overlayCtx.fillStyle = '#ffffff';
        overlayCtx.strokeStyle = '#0284c7';
        overlayCtx.lineWidth = 1.5 / view.scale;
        overlayCtx.beginPath();
        overlayCtx.roundRect ? overlayCtx.roundRect(h.x - hs / 2, h.y - hs / 2, hs, hs, 2 / view.scale) : overlayCtx.rect(h.x - hs / 2, h.y - hs / 2, hs, hs);
        overlayCtx.fill();
        overlayCtx.stroke();
      }
    }
  }

  overlayCtx.restore();
}

function renderCanvas() {
  renderBoardToCanvas(mainCanvas, mainCtx, { forExport: false });
  renderOverlay();
  boardTitleLabel.textContent = board.title || board.id || '主画板';
  btnUndo.disabled = !canUndoServer;
  btnRedo.disabled = !canRedoServer;
}

function exportBoardPngDataUrl() {
  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d');
  renderBoardToCanvas(off, offCtx, { forExport: true });
  return off.toDataURL('image/png');
}

// ---------- Server Sync & Mutation Queue ----------
function applyBoardData(data) {
  if (!data) return;
  if (Array.isArray(data.boards)) boardsList = data.boards;
  if (data.canUndo !== undefined) canUndoServer = Boolean(data.canUndo);
  if (data.canRedo !== undefined) canRedoServer = Boolean(data.canRedo);
  if (data.board) {
    const prevId = board.id;
    const prevAuthor = data.board.updatedBy;
    const prevRev = board.revision;
    board = data.board;
    if (!hasInitializedView || prevId !== board.id) {
      hasInitializedView = true;
      userHasPannedOrZoomed = false;
      fitViewportToBoard();
    } else if (prevAuthor === 'agent' && board.revision > prevRev) {
      showToast('智能体已更新画板');
    }
    // Clear selection for deleted IDs
    const liveIds = new Set(board.elements.map((e) => e.id));
    for (const id of Array.from(selectedIds)) {
      if (!liveIds.has(id)) selectedIds.delete(id);
    }
    renderCanvas();
    renderStyleSubPill();
    // Push clean PNG render back to server if needed for agent vision
    if (isConnected && viewMode === 'live' && lastUploadedSnapshotRev !== board.revision) {
      scheduleSnapshotUpload(board.revision);
    }
  }
}

let snapTimer = null;
function scheduleSnapshotUpload(rev) {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(async () => {
    if (!isConnected || viewMode !== 'live' || lastUploadedSnapshotRev === rev) return;
    try {
      const pngBase64 = exportBoardPngDataUrl();
      lastUploadedSnapshotRev = rev;
      await app.callServerTool({
        name: 'app_save_snapshot',
        arguments: { boardId: board.id, revision: rev, pngBase64 },
      });
    } catch {}
  }, 160);
}

function enqueueMutation(ops, { includeSnapshot = true } = {}) {
  if (viewMode === 'file') {
    applyLocalOpsFallback(ops);
    return Promise.resolve();
  }
  if (!isConnected || !hostCaps?.serverTools) {
    applyLocalOpsFallback(ops);
    return Promise.resolve();
  }
  mutatingCount++;
  localOpEpoch++;
  setSyncing(true);
  const run = async () => {
    try {
      const args = { boardId: board.id, ops };
      if (includeSnapshot) {
        args.snapshotPngBase64 = exportBoardPngDataUrl();
      }
      const res = await app.callServerTool({ name: 'app_mutate', arguments: args });
      if (res?.structuredContent?.board) {
        lastUploadedSnapshotRev = res.structuredContent.board.revision;
        applyBoardData(res.structuredContent);
      }
    } catch (err) {
      console.error('Mutation failed:', err);
    } finally {
      mutatingCount = Math.max(0, mutatingCount - 1);
      setSyncing(false);
    }
  };
  mutationChain = mutationChain.then(run, run);
  return mutationChain;
}

// Local optimistic fallback (for file viewer mode or standalone browser preview)
const localUndo = [];
const localRedo = [];
function applyLocalOpsFallback(ops) {
  for (const op of ops) {
    if (op.op === 'undo') {
      if (localUndo.length) {
        localRedo.push(JSON.stringify(board));
        board = JSON.parse(localUndo.pop());
      }
      continue;
    }
    if (op.op === 'redo') {
      if (localRedo.length) {
        localUndo.push(JSON.stringify(board));
        board = JSON.parse(localRedo.pop());
      }
      continue;
    }
    if (op.op !== 'activate_layer') {
      localUndo.push(JSON.stringify(board));
      if (localUndo.length > 40) localUndo.shift();
      localRedo.length = 0;
    }
    if (op.op === 'add') {
      const items = op.elements || (op.element ? [op.element] : []);
      for (const el of items) board.elements.push(el);
    } else if (op.op === 'update') {
      const map = new Map(board.elements.map((e) => [e.id, e]));
      for (const u of (op.updates || [op])) {
        const cur = map.get(u.id);
        if (cur) Object.assign(cur, u);
      }
    } else if (op.op === 'delete') {
      const drop = new Set(op.ids || []);
      board.elements = board.elements.filter((e) => !drop.has(e.id));
    } else if (op.op === 'clear') {
      board.elements = op.layerId ? board.elements.filter((e) => e.layerId !== op.layerId) : [];
    } else if (op.op === 'set_canvas') {
      Object.assign(board, {
        ...(op.title !== undefined ? { title: op.title } : {}),
        ...(op.width !== undefined ? { width: op.width } : {}),
        ...(op.height !== undefined ? { height: op.height } : {}),
        ...(op.background !== undefined ? { background: op.background } : {}),
        ...(op.showGrid !== undefined ? { showGrid: op.showGrid } : {}),
      });
    } else if (op.op === 'activate_layer') {
      board.activeLayerId = op.layerId;
    } else if (op.op === 'layer_create') {
      const id = op.layerId || `layer-${Date.now().toString(36)}`;
      board.layers.push({ id, name: op.name || `图层 ${board.layers.length + 1}`, visible: true, locked: false, opacity: 1 });
      board.activeLayerId = id;
    } else if (op.op === 'layer_update') {
      const l = board.layers.find((x) => x.id === op.layerId);
      if (l) Object.assign(l, op);
    } else if (op.op === 'layer_delete' && board.layers.length > 1) {
      board.layers = board.layers.filter((l) => l.id !== op.layerId);
      board.elements = board.elements.filter((e) => e.layerId !== op.layerId);
      if (board.activeLayerId === op.layerId) board.activeLayerId = board.layers[0].id;
    }
  }
  canUndoServer = localUndo.length > 0;
  canRedoServer = localRedo.length > 0;
  renderCanvas();
  renderStyleSubPill();
}

async function pollSync() {
  if (!isConnected || viewMode !== 'live' || !hostCaps?.serverTools) return;
  if (syncInFlight || isPointerDown || mutatingCount > 0) return;
  syncInFlight = true;
  const epochAtStart = localOpEpoch;
  try {
    const res = await app.callServerTool({
      name: 'app_sync',
      arguments: { boardId: board.id, sinceRevision: board.revision },
    });
    const sc = res?.structuredContent;
    if (sc?.changed && !isPointerDown && mutatingCount === 0 && epochAtStart === localOpEpoch) {
      applyBoardData(sc);
    }
  } catch {
  } finally {
    syncInFlight = false;
  }
}

function startSyncLoop() {
  clearInterval(syncTimer);
  syncTimer = setInterval(() => {
    if (document.visibilityState === 'visible') pollSync();
  }, 450);
}

// ---------- Tools & Contextual Sub-Pill ----------
function setTool(tool) {
  activeTool = tool;
  viewportEl.setAttribute('data-tool', tool);
  document.querySelectorAll('#toolDock .tool-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.tool === tool);
  });
  if (tool !== 'select') selectedIds.clear();
  renderCanvas();
  renderStyleSubPill();
}

function renderStyleSubPill() {
  const selectedEls = board.elements.filter((e) => selectedIds.has(e.id));
  const showSelection = activeTool === 'select' && selectedEls.length > 0;
  const showDrawing = ['pen', 'marker', 'rect', 'ellipse', 'arrow', 'line', 'text'].includes(activeTool);

  if (!showSelection && !showDrawing) {
    styleSubPill.classList.add('hidden');
    return;
  }
  styleSubPill.classList.remove('hidden');

  const currentColor = showSelection
    ? (selectedEls[0].type === 'text' ? selectedEls[0].color : (selectedEls[0].stroke || '#38bdf8'))
    : activeColor;

  const swatchesHtml = COLORS.map((c) =>
    `<button class="swatch ${currentColor?.toLowerCase() === c.toLowerCase() ? 'active' : ''}" data-color="${c}" style="background:${c}" title="${c}"></button>`
  ).join('');

  const customColorHtml = `<label class="color-picker-wrap" title="自定义颜色"><input id="customColorInput" type="color" value="${currentColor?.startsWith('#') ? currentColor : '#38bdf8'}" /></label>`;

  const widthHtml = (activeTool !== 'text') ? STROKE_WIDTHS.map((w) =>
    `<button class="size-btn ${activeStrokeWidth === w ? 'active' : ''}" data-width="${w}" title="线宽 ${w}px"><span class="size-dot" style="width:${Math.min(14, 3 + w * 0.7)}px;height:${Math.min(14, 3 + w * 0.7)}px"></span></button>`
  ).join('') : '';

  let extraHtml = '';
  if (activeTool === 'marker') {
    extraHtml = `<span class="pill-divider"></span>
      <button class="chip-toggle ${brushStyle === 'highlighter' ? 'active' : ''}" data-brush="highlighter">荧光</button>
      <button class="chip-toggle ${brushStyle === 'glow' ? 'active' : ''}" data-brush="glow">霓虹发光</button>`;
  } else if (activeTool === 'rect' || activeTool === 'ellipse') {
    extraHtml = `<span class="pill-divider"></span>
      <button class="chip-toggle ${fillEnabled ? 'active' : ''}" id="btnToggleFill">填充</button>
      ${activeTool === 'rect' ? `<button class="chip-toggle ${glassCardMode ? 'active' : ''}" id="btnToggleGlass">玻璃卡片</button>` : ''}`;
  } else if (showSelection) {
    extraHtml = `<span class="pill-divider"></span>
      <button class="chip-toggle" id="btnSelFront">置顶</button>
      <button class="chip-toggle" id="btnSelBack">置底</button>
      <button class="chip-toggle" id="btnSelDup">复制</button>
      <button class="chip-toggle" id="btnSelDel" style="color:var(--lc-danger)">删除</button>`;
  }

  styleSubPill.innerHTML = `${swatchesHtml}${customColorHtml}${widthHtml ? `<span class="pill-divider"></span>${widthHtml}` : ''}${extraHtml}`;

  styleSubPill.querySelectorAll('.swatch').forEach((btn) => {
    btn.onclick = () => applyColorChoice(btn.dataset.color);
  });
  const customInput = document.getElementById('customColorInput');
  if (customInput) customInput.oninput = (e) => applyColorChoice(e.target.value);

  styleSubPill.querySelectorAll('.size-btn').forEach((btn) => {
    btn.onclick = () => {
      const w = Number(btn.dataset.width);
      activeStrokeWidth = w;
      if (showSelection) {
        const updates = selectedEls.map((el) => ({ id: el.id, strokeWidth: w }));
        selectedEls.forEach((el) => { el.strokeWidth = w; });
        renderCanvas();
        enqueueMutation([{ op: 'update', updates }]);
      }
      renderStyleSubPill();
    };
  });

  styleSubPill.querySelectorAll('[data-brush]').forEach((btn) => {
    btn.onclick = () => {
      brushStyle = btn.dataset.brush;
      renderStyleSubPill();
    };
  });

  const btnFill = document.getElementById('btnToggleFill');
  if (btnFill) btnFill.onclick = () => { fillEnabled = !fillEnabled; renderStyleSubPill(); };
  const btnGlass = document.getElementById('btnToggleGlass');
  if (btnGlass) btnGlass.onclick = () => { glassCardMode = !glassCardMode; renderStyleSubPill(); };

  const btnFront = document.getElementById('btnSelFront');
  if (btnFront) btnFront.onclick = () => reorderSelection(true);
  const btnBack = document.getElementById('btnSelBack');
  if (btnBack) btnBack.onclick = () => reorderSelection(false);
  const btnDup = document.getElementById('btnSelDup');
  if (btnDup) btnDup.onclick = duplicateSelection;
  const btnDel = document.getElementById('btnSelDel');
  if (btnDel) btnDel.onclick = deleteSelection;
}

function applyColorChoice(c) {
  activeColor = c;
  const selectedEls = board.elements.filter((e) => selectedIds.has(e.id));
  if (activeTool === 'select' && selectedEls.length) {
    const updates = selectedEls.map((el) => {
      if (el.type === 'text') {
        el.color = c;
        return { id: el.id, color: c };
      }
      el.stroke = c;
      const patch = { id: el.id, stroke: c };
      if ((el.type === 'rect' || el.type === 'ellipse') && el.fill && el.fill !== 'none') {
        el.fill = colorWithAlpha(c, 0.16);
        patch.fill = el.fill;
      }
      return patch;
    });
    renderCanvas();
    enqueueMutation([{ op: 'update', updates }]);
  }
  renderStyleSubPill();
}

function deleteSelection() {
  if (!selectedIds.size) return;
  const ids = Array.from(selectedIds);
  board.elements = board.elements.filter((e) => !selectedIds.has(e.id));
  selectedIds.clear();
  renderCanvas();
  renderStyleSubPill();
  enqueueMutation([{ op: 'delete', ids }]);
}

function duplicateSelection() {
  const sel = board.elements.filter((e) => selectedIds.has(e.id));
  if (!sel.length) return;
  const clones = sel.map((el) => {
    const copy = JSON.parse(JSON.stringify(el));
    copy.id = `el_${Math.random().toString(36).slice(2, 10)}`;
    copy.author = 'user';
    if (copy.x !== undefined) copy.x += 24;
    if (copy.y !== undefined) copy.y += 24;
    if (copy.cx !== undefined) copy.cx += 24;
    if (copy.cy !== undefined) copy.cy += 24;
    if (copy.x1 !== undefined) { copy.x1 += 24; copy.x2 += 24; copy.y1 += 24; copy.y2 += 24; }
    if (Array.isArray(copy.points)) copy.points = copy.points.map((p) => ({ ...p, x: p.x + 24, y: p.y + 24 }));
    return copy;
  });
  selectedIds = new Set(clones.map((c) => c.id));
  board.elements.push(...clones);
  renderCanvas();
  renderStyleSubPill();
  enqueueMutation([{ op: 'add', elements: clones }]);
}

function reorderSelection(toFront) {
  const ids = Array.from(selectedIds);
  if (!ids.length) return;
  const updates = ids.map((id) => ({ id, ...(toFront ? { bringToFront: true } : { sendToBack: true }) }));
  const sel = board.elements.filter((e) => selectedIds.has(e.id));
  const rest = board.elements.filter((e) => !selectedIds.has(e.id));
  board.elements = toFront ? [...rest, ...sel] : [...sel, ...rest];
  renderCanvas();
  enqueueMutation([{ op: 'update', updates }]);
}

// ---------- Pointer Interactions ----------
function getActiveLayerLocked() {
  const layer = (board.layers || []).find((l) => l.id === board.activeLayerId);
  return Boolean(layer?.locked);
}

viewportEl.addEventListener('pointerdown', (e) => {
  if (e.button === 2) return;
  closeAllPopovers();
  if (!textEditorEl.classList.contains('hidden')) {
    commitTextEditor();
    return;
  }

  viewportEl.setPointerCapture(e.pointerId);
  isPointerDown = true;
  localOpEpoch++;

  if (e.button === 1 || spacePressed || activeTool === 'hand') {
    isPanning = true;
    viewportEl.classList.add('is-panning');
    panStart = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    return;
  }

  const pt = screenToBoard(e.clientX, e.clientY);

  if (activeTool === 'select') {
    // Check resize handles first if single element selected
    const selBounds = getCombinedSelectionBounds();
    if (selBounds && selBounds.count === 1) {
      const pad = 4 / view.scale;
      const box = { x: selBounds.x - pad, y: selBounds.y - pad, w: selBounds.w + pad * 2, h: selBounds.h + pad * 2 };
      const handleTol = 10 / view.scale;
      for (const h of getResizeHandles(box)) {
        if (Math.hypot(pt.x - h.x, pt.y - h.y) <= handleTol) {
          const targetId = Array.from(selectedIds)[0];
          const targetEl = board.elements.find((x) => x.id === targetId);
          dragState = {
            mode: 'resize',
            handle: h.id,
            startPt: pt,
            origBounds: selBounds,
            origEl: JSON.parse(JSON.stringify(targetEl)),
          };
          return;
        }
      }
    }

    const hit = findHitElement(pt.x, pt.y);
    if (hit) {
      if (e.shiftKey) {
        if (selectedIds.has(hit.id)) selectedIds.delete(hit.id);
        else selectedIds.add(hit.id);
      } else if (!selectedIds.has(hit.id)) {
        selectedIds = new Set([hit.id]);
      }
      const originals = new Map();
      for (const el of board.elements) {
        if (selectedIds.has(el.id)) originals.set(el.id, JSON.parse(JSON.stringify(el)));
      }
      dragState = { mode: 'move', startPt: pt, originals, moved: false };
      renderCanvas();
      renderStyleSubPill();
    } else {
      if (!e.shiftKey) selectedIds.clear();
      dragState = { mode: 'marquee', x0: pt.x, y0: pt.y, x1: pt.x, y1: pt.y };
      renderCanvas();
      renderStyleSubPill();
    }
    return;
  }

  if (getActiveLayerLocked()) {
    showToast('当前图层已锁定');
    isPointerDown = false;
    return;
  }

  if (activeTool === 'text') {
    openTextEditor(pt.x, pt.y, null);
    isPointerDown = false;
    return;
  }

  if (activeTool === 'eraser') {
    eraserHitIds.clear();
    const hit = findHitElement(pt.x, pt.y);
    if (hit) eraserHitIds.add(hit.id);
    renderCanvas();
    return;
  }

  const id = `el_${Math.random().toString(36).slice(2, 10)}`;
  const common = {
    id,
    layerId: board.activeLayerId,
    author: 'user',
    opacity: 1,
    rotation: 0,
    visible: true,
    locked: false,
  };

  if (activeTool === 'pen' || activeTool === 'marker') {
    const brush = activeTool === 'marker' ? (brushStyle === 'glow' ? 'glow' : 'highlighter') : 'pen';
    draftElement = {
      ...common,
      type: 'freehand',
      brush,
      stroke: activeColor,
      strokeWidth: activeTool === 'marker' && brush === 'highlighter' ? Math.max(14, activeStrokeWidth * 2.5) : activeStrokeWidth,
      opacity: brush === 'highlighter' ? 0.42 : 1,
      smooth: true,
      points: [{ x: Number(pt.x.toFixed(1)), y: Number(pt.y.toFixed(1)) }],
    };
  } else if (activeTool === 'rect') {
    draftElement = {
      ...common,
      type: 'rect',
      x: pt.x, y: pt.y, w: 2, h: 2,
      startX: pt.x, startY: pt.y,
      radius: glassCardMode ? 18 : 14,
      fill: fillEnabled ? colorWithAlpha(activeColor, 0.16) : 'none',
      stroke: activeColor,
      strokeWidth: activeStrokeWidth,
      glass: glassCardMode,
    };
  } else if (activeTool === 'ellipse') {
    draftElement = {
      ...common,
      type: 'ellipse',
      cx: pt.x, cy: pt.y, rx: 1, ry: 1,
      startX: pt.x, startY: pt.y,
      fill: fillEnabled ? colorWithAlpha(activeColor, 0.16) : 'none',
      stroke: activeColor,
      strokeWidth: activeStrokeWidth,
    };
  } else if (activeTool === 'line' || activeTool === 'arrow') {
    draftElement = {
      ...common,
      type: activeTool,
      x1: pt.x, y1: pt.y, x2: pt.x, y2: pt.y,
      stroke: activeColor,
      strokeWidth: activeStrokeWidth,
      startArrow: 'none',
      endArrow: activeTool === 'arrow' ? 'arrow' : 'none',
    };
  }
  renderCanvas();
});

viewportEl.addEventListener('pointermove', (e) => {
  if (!isPointerDown) return;
  if (isPanning) {
    userHasPannedOrZoomed = true;
    view.x = panStart.vx + (e.clientX - panStart.x);
    view.y = panStart.vy + (e.clientY - panStart.y);
    applyViewportTransform();
    return;
  }

  const pt = screenToBoard(e.clientX, e.clientY);

  if (activeTool === 'select' && dragState) {
    if (dragState.mode === 'marquee') {
      dragState.x1 = pt.x;
      dragState.y1 = pt.y;
      renderOverlay();
    } else if (dragState.mode === 'move') {
      const dx = pt.x - dragState.startPt.x;
      const dy = pt.y - dragState.startPt.y;
      if (Math.hypot(dx, dy) > 1) dragState.moved = true;
      for (const el of board.elements) {
        const orig = dragState.originals.get(el.id);
        if (!orig) continue;
        if (orig.type === 'rect' || orig.type === 'image' || orig.type === 'text' || orig.type === 'path') {
          el.x = orig.x + dx; el.y = orig.y + dy;
        } else if (orig.type === 'ellipse') {
          el.cx = orig.cx + dx; el.cy = orig.cy + dy;
        } else if (orig.type === 'line' || orig.type === 'arrow') {
          el.x1 = orig.x1 + dx; el.y1 = orig.y1 + dy;
          el.x2 = orig.x2 + dx; el.y2 = orig.y2 + dy;
          if (orig.cx !== undefined) { el.cx = orig.cx + dx; el.cy = orig.cy + dy; }
        } else if (orig.type === 'freehand' || orig.type === 'polygon') {
          el.points = orig.points.map((p) => ({ ...p, x: p.x + dx, y: p.y + dy }));
        }
      }
      renderCanvas();
    } else if (dragState.mode === 'resize') {
      applyResizeDrag(dragState, pt);
      renderCanvas();
    }
    return;
  }

  if (activeTool === 'eraser') {
    const hit = findHitElement(pt.x, pt.y);
    if (hit && !eraserHitIds.has(hit.id)) {
      eraserHitIds.add(hit.id);
      renderCanvas();
    }
    return;
  }

  if (!draftElement) return;
  if (draftElement.type === 'freehand') {
    const pts = draftElement.points;
    const prev = pts[pts.length - 1];
    if (!prev || Math.hypot(pt.x - prev.x, pt.y - prev.y) >= 1.8) {
      pts.push({ x: Number(pt.x.toFixed(1)), y: Number(pt.y.toFixed(1)) });
      renderCanvas();
    }
  } else if (draftElement.type === 'rect') {
    let dx = pt.x - draftElement.startX;
    let dy = pt.y - draftElement.startY;
    if (e.shiftKey) {
      const m = Math.max(Math.abs(dx), Math.abs(dy));
      dx = Math.sign(dx || 1) * m;
      dy = Math.sign(dy || 1) * m;
    }
    draftElement.x = dx >= 0 ? draftElement.startX : draftElement.startX + dx;
    draftElement.y = dy >= 0 ? draftElement.startY : draftElement.startY + dy;
    draftElement.w = Math.max(2, Math.abs(dx));
    draftElement.h = Math.max(2, Math.abs(dy));
    renderCanvas();
  } else if (draftElement.type === 'ellipse') {
    let dx = pt.x - draftElement.startX;
    let dy = pt.y - draftElement.startY;
    if (e.shiftKey) {
      const m = Math.max(Math.abs(dx), Math.abs(dy));
      dx = Math.sign(dx || 1) * m;
      dy = Math.sign(dy || 1) * m;
    }
    const x0 = dx >= 0 ? draftElement.startX : draftElement.startX + dx;
    const y0 = dy >= 0 ? draftElement.startY : draftElement.startY + dy;
    draftElement.rx = Math.max(2, Math.abs(dx) / 2);
    draftElement.ry = Math.max(2, Math.abs(dy) / 2);
    draftElement.cx = x0 + draftElement.rx;
    draftElement.cy = y0 + draftElement.ry;
    renderCanvas();
  } else if (draftElement.type === 'line' || draftElement.type === 'arrow') {
    let x2 = pt.x, y2 = pt.y;
    if (e.shiftKey) {
      const ang = Math.atan2(y2 - draftElement.y1, x2 - draftElement.x1);
      const snap = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4);
      const dist = Math.hypot(x2 - draftElement.x1, y2 - draftElement.y1);
      x2 = draftElement.x1 + Math.cos(snap) * dist;
      y2 = draftElement.y1 + Math.sin(snap) * dist;
    }
    draftElement.x2 = x2;
    draftElement.y2 = y2;
    renderCanvas();
  }
});

function applyResizeDrag(ds, pt) {
  const ob = ds.origBounds;
  let nx0 = ob.x, ny0 = ob.y, nx1 = ob.x + ob.w, ny1 = ob.y + ob.h;
  const h = ds.handle;
  if (h.includes('w')) nx0 = Math.min(nx1 - 8, pt.x);
  if (h.includes('e')) nx1 = Math.max(nx0 + 8, pt.x);
  if (h.includes('n')) ny0 = Math.min(ny1 - 8, pt.y);
  if (h.includes('s')) ny1 = Math.max(ny0 + 8, pt.y);

  const nw = nx1 - nx0, nh = ny1 - ny0;
  const orig = ds.origEl;
  const el = board.elements.find((x) => x.id === orig.id);
  if (!el) return;

  if (el.type === 'rect' || el.type === 'image') {
    el.x = nx0; el.y = ny0; el.w = nw; el.h = nh;
  } else if (el.type === 'ellipse') {
    el.rx = nw / 2; el.ry = nh / 2; el.cx = nx0 + el.rx; el.cy = ny0 + el.ry;
  } else if (el.type === 'line' || el.type === 'arrow') {
    const sx = ob.w > 0 ? nw / ob.w : 1;
    const sy = ob.h > 0 ? nh / ob.h : 1;
    el.x1 = nx0 + (orig.x1 - ob.x) * sx;
    el.y1 = ny0 + (orig.y1 - ob.y) * sy;
    el.x2 = nx0 + (orig.x2 - ob.x) * sx;
    el.y2 = ny0 + (orig.y2 - ob.y) * sy;
  } else if (el.type === 'freehand' || el.type === 'polygon') {
    const sx = ob.w > 0 ? nw / ob.w : 1;
    const sy = ob.h > 0 ? nh / ob.h : 1;
    el.points = orig.points.map((p) => ({
      ...p,
      x: nx0 + (p.x - ob.x) * sx,
      y: ny0 + (p.y - ob.y) * sy,
    }));
  } else if (el.type === 'text') {
    const sy = ob.h > 0 ? nh / ob.h : 1;
    el.x = nx0; el.y = ny0;
    el.fontSize = Math.max(10, Math.round((orig.fontSize || 20) * sy));
  }
}

function finishPointerInteraction(e) {
  if (!isPointerDown) return;
  isPointerDown = false;
  try { viewportEl.releasePointerCapture(e.pointerId); } catch {}

  if (isPanning) {
    isPanning = false;
    viewportEl.classList.remove('is-panning');
    return;
  }

  if (activeTool === 'select' && dragState) {
    const ds = dragState;
    dragState = null;
    if (ds.mode === 'marquee') {
      const mx0 = Math.min(ds.x0, ds.x1), mx1 = Math.max(ds.x0, ds.x1);
      const my0 = Math.min(ds.y0, ds.y1), my1 = Math.max(ds.y0, ds.y1);
      if (mx1 - mx0 > 4 || my1 - my0 > 4) {
        for (const el of board.elements) {
          const b = getBounds(el);
          if (b.x + b.w >= mx0 && b.x <= mx1 && b.y + b.h >= my0 && b.y <= my1) {
            selectedIds.add(el.id);
          }
        }
      }
      renderCanvas();
      renderStyleSubPill();
    } else if (ds.mode === 'move' && ds.moved) {
      const updates = board.elements.filter((x) => selectedIds.has(x.id)).map((x) => ({ ...x }));
      renderCanvas();
      enqueueMutation([{ op: 'update', updates }]);
    } else if (ds.mode === 'resize') {
      const target = board.elements.find((x) => x.id === ds.origEl.id);
      if (target) enqueueMutation([{ op: 'update', updates: [{ ...target }] }]);
    }
    return;
  }

  if (activeTool === 'eraser') {
    const ids = Array.from(eraserHitIds);
    eraserHitIds.clear();
    if (ids.length) {
      const drop = new Set(ids);
      board.elements = board.elements.filter((x) => !drop.has(x.id));
      renderCanvas();
      enqueueMutation([{ op: 'delete', ids }]);
    } else {
      renderCanvas();
    }
    return;
  }

  if (draftElement) {
    const el = draftElement;
    draftElement = null;
    delete el.startX;
    delete el.startY;
    const valid =
      (el.type === 'freehand' && el.points.length >= 1) ||
      (el.type === 'rect' && (el.w >= 4 || el.h >= 4)) ||
      (el.type === 'ellipse' && (el.rx >= 3 || el.ry >= 3)) ||
      ((el.type === 'line' || el.type === 'arrow') && Math.hypot(el.x2 - el.x1, el.y2 - el.y1) >= 6);
    if (valid) {
      board.elements.push(el);
      renderCanvas();
      enqueueMutation([{ op: 'add', elements: [el] }]);
    } else {
      renderCanvas();
    }
  }
}

viewportEl.addEventListener('pointerup', finishPointerInteraction);
viewportEl.addEventListener('pointercancel', finishPointerInteraction);

viewportEl.addEventListener('dblclick', (e) => {
  const pt = screenToBoard(e.clientX, e.clientY);
  const hit = findHitElement(pt.x, pt.y);
  if (hit && hit.type === 'text') {
    openTextEditor(hit.x, hit.y, hit);
  }
});

// Wheel Zoom & Pan
viewportEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) > 0) {
    userHasPannedOrZoomed = true;
    // Smooth cursor-centered zoom
    const factor = e.deltaY < 0 ? 1.09 : 0.915;
    const newScale = Math.max(0.15, Math.min(4.0, view.scale * factor));
    const ratio = newScale / view.scale;
    view.x = e.clientX - (e.clientX - view.x) * ratio;
    view.y = e.clientY - (e.clientY - view.y) * ratio;
    view.scale = newScale;
    applyViewportTransform();
  }
}, { passive: false });

// ---------- Inline Text Editor ----------
let pendingTextPos = { x: 100, y: 100 };
function openTextEditor(bx, by, existingEl) {
  editingTextId = existingEl ? existingEl.id : null;
  pendingTextPos = { x: bx, y: by };
  const scr = boardToScreen(bx, by);
  textEditorEl.style.left = `${Math.max(12, Math.min(window.innerWidth - 220, scr.x))}px`;
  textEditorEl.style.top = `${Math.max(54, Math.min(window.innerHeight - 140, scr.y))}px`;
  textEditorEl.classList.remove('hidden');
  textInputEl.value = existingEl ? existingEl.text : '';
  textInputEl.style.color = existingEl ? existingEl.color : activeColor;
  renderCanvas();
  setTimeout(() => textInputEl.focus(), 10);
}

function commitTextEditor() {
  if (textEditorEl.classList.contains('hidden')) return;
  const val = textInputEl.value.trim();
  const editId = editingTextId;
  editingTextId = null;
  textEditorEl.classList.add('hidden');
  if (!val) {
    renderCanvas();
    return;
  }
  if (editId) {
    const el = board.elements.find((x) => x.id === editId);
    if (el) {
      el.text = val;
      renderCanvas();
      enqueueMutation([{ op: 'update', updates: [{ id: editId, text: val }] }]);
    }
  } else {
    const el = {
      id: `el_${Math.random().toString(36).slice(2, 10)}`,
      type: 'text',
      layerId: board.activeLayerId,
      author: 'user',
      x: pendingTextPos.x,
      y: pendingTextPos.y,
      text: val,
      fontSize: 22,
      fontWeight: '500',
      color: activeColor,
      align: 'left',
      opacity: 1,
      visible: true,
    };
    board.elements.push(el);
    renderCanvas();
    enqueueMutation([{ op: 'add', elements: [el] }]);
  }
}

textInputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    commitTextEditor();
  } else if (e.key === 'Escape') {
    editingTextId = null;
    textEditorEl.classList.add('hidden');
    renderCanvas();
  }
});

// ---------- Paste Image Support ----------
window.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items || [];
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (!file) continue;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const maxW = Math.min(600, board.width * 0.7);
          const scale = img.width > maxW ? maxW / img.width : 1;
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const el = {
            id: `el_${Math.random().toString(36).slice(2, 10)}`,
            type: 'image',
            layerId: board.activeLayerId,
            author: 'user',
            x: Math.round((board.width - w) / 2),
            y: Math.round((board.height - h) / 2),
            w, h, radius: 14,
            src: reader.result,
            opacity: 1,
          };
          board.elements.push(el);
          renderCanvas();
          enqueueMutation([{ op: 'add', elements: [el] }]);
          showToast('已粘贴图片到画板');
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
      break;
    }
  }
});

// ---------- Popovers ----------
const popBoards = document.getElementById('popBoards');
const popLayers = document.getElementById('popLayers');
const popSettings = document.getElementById('popSettings');
const popExport = document.getElementById('popExport');
const popAgent = document.getElementById('popAgent');
const allPopovers = [popBoards, popLayers, popSettings, popExport, popAgent];

function closeAllPopovers(except = null) {
  for (const p of allPopovers) {
    if (p !== except) p.classList.add('hidden');
  }
}

function positionPopover(pop, anchorBtn, alignRight = false) {
  const rect = anchorBtn.getBoundingClientRect();
  pop.style.top = `${rect.bottom + 8}px`;
  if (alignRight) {
    pop.style.left = 'auto';
    pop.style.right = `${Math.max(12, window.innerWidth - rect.right)}px`;
  } else {
    pop.style.right = 'auto';
    pop.style.left = `${Math.max(12, Math.min(window.innerWidth - 260, rect.left))}px`;
  }
}

function togglePopover(pop, anchorBtn, builder, alignRight = false) {
  const wasHidden = pop.classList.contains('hidden');
  closeAllPopovers();
  if (!wasHidden) return;
  builder();
  pop.classList.remove('hidden');
  positionPopover(pop, anchorBtn, alignRight);
}

// Board Switcher Popover
document.getElementById('btnBoardMenu').onclick = (e) => {
  e.stopPropagation();
  togglePopover(popBoards, e.currentTarget, renderBoardPopover, false);
};

function renderBoardPopover() {
  const list = boardsList.length ? boardsList : [{ id: board.id, title: board.title, elementCount: board.elements.length, active: true }];
  popBoards.innerHTML = `
    <div class="pop-title"><span>画板工作区</span><span>${list.length} 个</span></div>

// Layers Popover
document.getElementById('btnLayers').onclick = (e) => {

};

function renderLayersPopover() {
  popLayers.innerHTML = `
    <div class="pop-title">
      <span>图层</span>
      <button id="btnAddLayer" class="chip-toggle active">+ 新建图层</button>
    </div>
    <div class="pop-list">
      ${[...board.layers].reverse().map((l) => `
        <div class="pop-row ${l.id === board.activeLayerId ? 'active' : ''}" data-layer-id="${l.id}">
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${escapeHtml(l.name)}</span>
          <button class="chip-toggle" data-toggle-vis="${l.id}">${l.visible ? '显' : '隐'}</button>
          <button class="chip-toggle ${l.locked ? 'active' : ''}" data-toggle-lock="${l.id}">${l.locked ? '锁' : '开'}</button>
          ${board.layers.length > 1 ? `<button class="chip-toggle" data-del-layer="${l.id}" style="color:var(--lc-danger)">删</button>` : ''}
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('btnAddLayer').onclick = () => {
    enqueueMutation([{ op: 'layer_create', name: `图层 ${board.layers.length + 1}` }]).then(renderLayersPopover);
  };
  popLayers.querySelectorAll('[data-layer-id]').forEach((row) => {
    row.onclick = (ev) => {
      if (ev.target.tagName === 'BUTTON') return;
      board.activeLayerId = row.dataset.layerId;
      enqueueMutation([{ op: 'activate_layer', layerId: row.dataset.layerId }]);
      renderLayersPopover();
    };
  });
  popLayers.querySelectorAll('[data-toggle-vis]').forEach((btn) => {
    btn.onclick = () => {
      const l = board.layers.find((x) => x.id === btn.dataset.toggleVis);
      if (!l) return;
      l.visible = !l.visible;
      renderCanvas();
      enqueueMutation([{ op: 'layer_update', layerId: l.id, visible: l.visible }]).then(renderLayersPopover);
    };
  });
  popLayers.querySelectorAll('[data-toggle-lock]').forEach((btn) => {
    btn.onclick = () => {
      const l = board.layers.find((x) => x.id === btn.dataset.toggleLock);
      if (!l) return;
      l.locked = !l.locked;
      enqueueMutation([{ op: 'layer_update', layerId: l.id, locked: l.locked }]).then(renderLayersPopover);
    };
  });
  popLayers.querySelectorAll('[data-del-layer]').forEach((btn) => {
    btn.onclick = () => {
      enqueueMutation([{ op: 'layer_delete', layerId: btn.dataset.delLayer }]).then(renderLayersPopover);
    };
  });
}

document.getElementById('btnExport').onclick = (e) => {
